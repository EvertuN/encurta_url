<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EncurtaURL - Encurtador de URLs</title>
  <meta name="description" content="Transforme URLs enormes em links curtos e fáceis de compartilhar.">
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/index.css">
</head>

<body>

  <div id="header-placeholder"></div>

  <main>
    <div class="badge">Encurtador de URLs</div>

    <h1>Links longos.<br>Agora, simples.</h1>

    <p class="description">
      Transforme URLs enormes em links curtos e fáceis de compartilhar.
    </p>

    <div class="form">
      <input type="text" id="url-input" placeholder="Cole sua URL aqui..." autocomplete="off">
      <button type="button" id="shorten-btn" onclick="handleShorten()">
        <span class="spinner" id="spinner"></span>
        <span id="btn-text">Encurtar</span>
      </button>
    </div>

    <div class="error-msg" id="error-msg"></div>

    <div class="result" id="result">
      <div class="result-label">Seu link curto</div>
      <div class="result-row">
        <a href="#" class="result-url" id="result-url" target="_blank" rel="noopener noreferrer"></a>
        <button class="btn-copy" id="btn-copy" onclick="copyLink()">Copiar</button>
      </div>
      <div class="result-original" id="result-original"></div>
    </div>

    <div class="stats">
      <div class="stat">
        <strong>62⁶</strong>
        <span>combinações possíveis</span>
      </div>
      <div class="stat">
        <strong>&lt; 5ms</strong>
        <span>tempo de resposta</span>
      </div>
      <div class="stat">
        <strong>Redis</strong>
        <span>cache em memória</span>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="/js/common.js"></script>
  <script src="/js/index.js"></script>

</body>

</html>
