<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EncurtaURL — Estatísticas</title>
    <meta name="description" content="Consulte as estatísticas de acessos dos seus links encurtados.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", Arial, Helvetica, sans-serif;
            background: #f7f8fa;
            color: #171717;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        header {
            width: 100%;
            border-bottom: 1px solid #e5e7eb;
            background: #ffffff;
        }

        nav {
            max-width: 1000px;
            margin: 0 auto;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            color: #111827;
            text-decoration: none;
        }

        .logo span {
            color: #4f46e5;
        }

        .nav-link {
            text-decoration: none;
            color: #6b7280;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.15s;
        }

        .nav-link:hover {
            color: #111827;
        }

        main {
            flex: 1;
            max-width: 640px;
            width: 100%;
            margin: 0 auto;
            padding: 60px 20px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 15px;
            margin-bottom: 32px;
        }

        /* Formulário de busca */
        .search-form {
            display: flex;
            gap: 8px;
            background: #ffffff;
            padding: 6px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            margin-bottom: 12px;
        }

        .search-form input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            padding: 12px 14px;
            font-size: 15px;
            font-family: inherit;
            color: #111827;
            background: transparent;
        }

        .search-form input::placeholder {
            color: #9ca3af;
        }

        .search-form button {
            border: none;
            background: #4f46e5;
            color: #fff;
            padding: 0 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .search-form button:hover:not(:disabled) {
            background: #4338ca;
        }

        .search-form button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .spinner {
            display: none;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Erro */
        .error-msg {
            display: none;
            margin-bottom: 16px;
            padding: 11px 14px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            color: #b91c1c;
            font-size: 14px;
        }

        /* Painel de resultado */
        .stats-panel {
            display: none;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 4px;
        }

        .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid #f3f4f6;
        }

        .panel-code {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 4px;
        }

        .panel-url {
            font-size: 14px;
            color: #374151;
            word-break: break-all;
        }

        .panel-url a {
            color: #4f46e5;
            text-decoration: none;
        }

        .panel-url a:hover {
            text-decoration: underline;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-top: 1px solid #f3f4f6;
        }

        .stat-item {
            padding: 20px;
            text-align: center;
        }

        .stat-item:first-child {
            border-right: 1px solid #f3f4f6;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #111827;
            line-height: 1;
            margin-bottom: 6px;
        }

        .stat-label {
            font-size: 12px;
            color: #9ca3af;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .stat-sub {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }

        /* Dica */
        .hint {
            font-size: 13px;
            color: #9ca3af;
            margin-top: 10px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 28px 20px;
            color: #9ca3af;
            font-size: 13px;
            border-top: 1px solid #e5e7eb;
            background: #fff;
        }

        @media (max-width: 600px) {
            main { padding-top: 40px; }
            h1 { font-size: 22px; }
            .search-form { flex-direction: column; }
            .search-form button { height: 46px; justify-content: center; }
            .stats-grid { grid-template-columns: 1fr; }
            .stat-item:first-child { border-right: none; border-bottom: 1px solid #f3f4f6; }
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <a href="/" class="logo">Encurta<span>URL</span></a>
            <a href="/admin" class="nav-link" aria-current="page">Estatísticas</a>
        </nav>
    </header>

    <main>
        <h1>Estatísticas</h1>
        <p class="subtitle">Digite o código curto ou cole a URL completa para ver os acessos.</p>

        <div class="search-form">
            <input
                type="text"
                id="code-input"
                placeholder="Código (ex: 5V3JJF) ou URL completa"
                autocomplete="off"
            >
            <button type="button" id="search-btn" onclick="handleSearch()">
                <span class="spinner" id="spinner"></span>
                <span id="btn-text">Consultar</span>
            </button>
        </div>

        <div class="error-msg" id="error-msg"></div>

        <div class="stats-panel" id="stats-panel">
            <div class="panel-header">
                <div class="panel-code" id="panel-code"></div>
                <div class="panel-url" id="panel-url"></div>
            </div>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="stat-clicks">0</div>
                    <div class="stat-label">Total de Cliques</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-last" style="font-size: 15px; line-height: 1.4;">—</div>
                    <div class="stat-label">Último Clique</div>
                    <div class="stat-sub" id="stat-last-sub"></div>
                </div>
            </div>
        </div>

        <p class="hint" id="hint">Ex: <code>5V3JJF</code> ou <code>http://localhost:8000/5V3JJF</code></p>
    </main>

    <footer>
        © 2026 EncurtaURL. Simples e rápido. &mdash; <a href="/" style="color: #9ca3af;">Encurtar</a>
    </footer>

    <script>
        async function handleSearch() {
            const input = document.getElementById('code-input');
            const btn = document.getElementById('search-btn');
            const spinner = document.getElementById('spinner');
            const btnText = document.getElementById('btn-text');
            const errorEl = document.getElementById('error-msg');
            const panel = document.getElementById('stats-panel');

            let val = input.value.trim();
            if (!val) return;

            // Extrai o código da URL caso o usuário cole a URL inteira
            const match = val.match(/([a-zA-Z0-9]{4,12})\/?$/);
            const code = match ? match[1] : val;

            errorEl.style.display = 'none';
            panel.style.display = 'none';
            document.getElementById('hint').style.display = 'none';

            btn.disabled = true;
            spinner.style.display = 'inline-block';
            btnText.textContent = 'Consultando...';

            try {
                // Busca stats e info em paralelo
                const [statsRes, infoRes] = await Promise.all([
                    fetch(`/urls/${encodeURIComponent(code)}/stats`),
                    fetch(`/urls/${encodeURIComponent(code)}`),
                ]);

                if (!statsRes.ok) {
                    const msg = statsRes.status === 404
                        ? `Código "${code}" não encontrado.`
                        : 'Erro ao consultar estatísticas.';
                    errorEl.textContent = msg;
                    errorEl.style.display = 'block';
                    return;
                }

                const stats = await statsRes.json();
                const info = infoRes.ok ? await infoRes.json() : null;

                // Cabeçalho do painel
                document.getElementById('panel-code').textContent = `Código: ${stats.short_code}`;
                const urlDiv = document.getElementById('panel-url');
                if (info) {
                    urlDiv.innerHTML = `Destino: <a href="${info.original_url}" target="_blank" rel="noopener noreferrer">${info.original_url}</a>`;
                } else {
                    urlDiv.textContent = '';
                }

                // Cliques
                document.getElementById('stat-clicks').textContent = stats.total_clicks;

                // Último clique
                if (stats.last_click) {
                    const d = new Date(stats.last_click);
                    document.getElementById('stat-last').textContent =
                        d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
                    document.getElementById('stat-last-sub').textContent =
                        d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                } else {
                    document.getElementById('stat-last').textContent = '—';
                    document.getElementById('stat-last-sub').textContent = 'sem acessos ainda';
                }

                panel.style.display = 'block';
            } catch (e) {
                errorEl.textContent = 'Erro de conexão com o servidor.';
                errorEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = 'Consultar';
            }
        }

        document.getElementById('code-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleSearch();
        });

        // Pré-preenche o input se vier com ?code=XXX na URL
        const params = new URLSearchParams(location.search);
        if (params.has('code')) {
            document.getElementById('code-input').value = params.get('code');
            handleSearch();
        }
    </script>

</body>
</html>
